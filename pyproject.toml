[project]
name = "yfin"
version = "0.1.0"
description = "Yahoo Finance ingestion pipeline for PostgreSQL 18 + TimescaleDB"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The [repair] extra is required: history(repair=True) lazily imports
    # scipy.ndimage and sklearn.cluster.DBSCAN. Without it every symbol
    # raises ModuleNotFoundError and no price history is written at all.
    "yfinance[repair]>=1.7.0",
    # Also arrives transitively via yfinance, but the proxy check imports
    # it directly and yfinance can run without it under
    # YF_DISABLE_CURL_CFFI. Leaning on a transitive dependency is fragile.
    "curl_cffi>=0.15",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
yfin = "yfin.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo: gercek PostgreSQL + TimescaleDB gerektirir (ag yok)",
    "live: gercek Yahoo API + gercek PostgreSQL gerektirir",
]
addopts = "-m 'not repo and not live'"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic autogenerate output is machine-generated
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "numpy.*", "curl_cffi.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
