[project]
name = "yfin"
version = "0.1.0"
description = "Yahoo Finance ingestion pipeline for PostgreSQL 18 + TimescaleDB"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The [repair] extra is required: history(repair=True) lazily imports
    # scipy.ndimage and sklearn.cluster.DBSCAN. Without it every symbol
    # raises ModuleNotFoundError and no price history is written at all.
    "yfinance[repair]>=1.7.0",
    # Also arrives transitively via yfinance, but the proxy check imports
    # it directly and yfinance can run without it under
    # YF_DISABLE_CURL_CFFI. Leaning on a transitive dependency is fragile.
    "curl_cffi>=0.15",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "tenacity>=8.2",
    "structlog>=24.1",
    # Both arrive transitively via yfinance, and both are used directly:
    # stream/connection.py opens its own websocket (yfinance's client does
    # not reconnect -- see the streaming design, K2) and stream/protocol.py
    # reads PricingData off the wire. Same reasoning as curl_cffi above.
    "websockets>=13",
    "protobuf>=5.27",
    # Not in the `api` extra any more. `stream/publish.py` runs in the
    # STREAM process, which has no reason to install FastAPI, and a
    # deployment that runs the pipeline without the HTTP layer would have
    # found the publish path importing something it does not have. redis-py
    # is pure Python, so carrying it in the base install costs a directory.
    "redis>=5.1",
]

[project.optional-dependencies]
# The HTTP layer is an extra on purpose: a data-pipeline host has no use
# for FastAPI or uvicorn, and `yfinance[repair]` already sets the pattern.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # Not optional: RFC 6749 requires the token endpoint to accept
    # application/x-www-form-urlencoded, and FastAPI's Form() refuses to
    # parse a body without this installed.
    "python-multipart>=0.0.9",
    # Pinned exactly, not floored. The library picks its value class from
    # PROMETHEUS_MULTIPROC_DIR at IMPORT time, process-wide, and the API is
    # the only service that runs multiprocess -- a minor release changing
    # that would be silent and would reach every other service too.
    "prometheus-client==0.26.0",
    # HTTP metrics. Compatible with the locked starlette, and it builds a
    # MultiProcessCollector when it sees PROMETHEUS_MULTIPROC_DIR, which is
    # what makes four uvicorn workers add up to one set of series.
    # `starlette-exporter` was rejected: no 3.13 metadata.
    "prometheus-fastapi-instrumentator>=8.1.0",
]
# Optional publish path. librdkafka rather than a pure-Python client: the
# relay is a synchronous process, so an async client would buy nothing.
kafka = ["confluent-kafka>=2.5"]
# Tracing. Optional for the same reason as `kafka`: without a collector to
# send to there is nothing to install these for, and `configure_tracing`
# and the log chain's trace context are both no-ops when they are absent.
#
# The instrumentations are pinned to the 0.65b0 line that matches SDK
# 1.44.0 -- they are versioned separately and a mismatched pair fails at
# import, not at first span. `-psycopg` is deliberately absent: it would
# nest a second span under every SQLAlchemy span and double the trace
# volume to say the same thing twice.
otel = [
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # API tests: TestClient rides on httpx; schemathesis drives the frozen
    # openapi.json; fakeredis keeps the counter tests off a real server.
    "httpx>=0.27",
    "schemathesis>=3.36",
    # The [lua] extra pulls in lupa: the rate limiter decides rate and
    # quota in a single Lua script, so without it those tests could only
    # run against a real server.
    "fakeredis[lua]>=2.25",
    # The stream connection tests drive a real loopback websocket server,
    # so they are async. Without this plugin bare pytest SKIPS `async def`
    # tests silently -- they would look green while never running.
    "pytest-asyncio>=0.24",
    # Validates the committed contract against the OpenAPI 3.1 meta-schema.
    # Reviewing a 2000-line document by eye does not catch an illegal
    # `license` pair or a malformed header object; this does.
    "openapi-spec-validator>=0.7",
]
# The scheduler that replaces cron. 3.11 rather than 4.0: 4.0 is still
# alpha and says it "should NOT be used in production", and `schedule` has
# no misfire handling, which is the one thing a nightly pipeline needs.
# Pinned exactly -- executor and misfire semantics are what this depends on.
scheduler = [
    "apscheduler==3.11.3",
    "prometheus-client==0.26.0",
]

[project.urls]
# Upstream: yfin builds on the `yfinance` library, which owns every call
# to Yahoo. Nothing here re-implements its scraping or repair logic.
"Upstream (yfinance)" = "https://github.com/ranaroussi/yfinance"
"Upstream docs" = "https://ranaroussi.github.io/yfinance/"

[project.scripts]
yfin = "yfin.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The published examples ship INSIDE the package, not under docs/. They are
# part of the document the running API serves, so a deployment installed
# from a wheel has to carry them -- otherwise /openapi.json in production
# would differ from the openapi.json this repository locks in CI.
[tool.setuptools.package-data]
"yfin.api.core" = ["examples/*.json"]
# The Vite build. Gitignored (`dist/`) and produced by `npm run build` in
# web/; without it a wheel serves /ui/api but no page, and logs why.
"yfin.ui" = ["static/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo: requires a real PostgreSQL + TimescaleDB (no network)",
    "live: requires the real Yahoo API and a real PostgreSQL",
]
addopts = "-m 'not repo and not live'"
asyncio_mode = "auto"
# The repo root is on the path so `import scripts.dump_openapi` resolves:
# `scripts/` is not a package and not part of the distribution, but the
# OpenAPI contract test renders through the same code CI runs. Without
# this the test errors on ModuleNotFoundError instead of comparing the
# document, which is a contract check that silently never runs.
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic autogenerate output is machine-generated
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Third-party packages that ship no `py.typed`. APScheduler 3.11 is one of
# them, so installing it does not help and the override is the only way.
module = [
    "yfinance.*",
    "pandas.*",
    "numpy.*",
    "curl_cffi.*",
    "scipy.*",
    "sklearn.*",
    "apscheduler.*",
]
ignore_missing_imports = true
