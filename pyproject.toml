[project]
name = "yfin"
version = "0.1.0"
description = "Yahoo Finance ingestion pipeline for PostgreSQL 18 + TimescaleDB"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The [repair] extra is required: history(repair=True) lazily imports
    # scipy.ndimage and sklearn.cluster.DBSCAN. Without it every symbol
    # raises ModuleNotFoundError and no price history is written at all.
    "yfinance[repair]>=1.7.0",
    # Also arrives transitively via yfinance, but the proxy check imports
    # it directly and yfinance can run without it under
    # YF_DISABLE_CURL_CFFI. Leaning on a transitive dependency is fragile.
    "curl_cffi>=0.15",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
# The HTTP layer is an extra on purpose: a data-pipeline host has no use
# for FastAPI or uvicorn, and `yfinance[repair]` already sets the pattern.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "redis>=5.1",
    # Not optional: RFC 6749 requires the token endpoint to accept
    # application/x-www-form-urlencoded, and FastAPI's Form() refuses to
    # parse a body without this installed.
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # API tests: TestClient rides on httpx; schemathesis drives the frozen
    # openapi.json; fakeredis keeps the counter tests off a real server.
    "httpx>=0.27",
    "schemathesis>=3.36",
    "fakeredis>=2.25",
]

[project.urls]
# Upstream: yfin builds on the `yfinance` library, which owns every call
# to Yahoo. Nothing here re-implements its scraping or repair logic.
"Upstream (yfinance)" = "https://github.com/ranaroussi/yfinance"
"Upstream docs" = "https://ranaroussi.github.io/yfinance/"

[project.scripts]
yfin = "yfin.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo: requires a real PostgreSQL + TimescaleDB (no network)",
    "live: requires the real Yahoo API and a real PostgreSQL",
]
addopts = "-m 'not repo and not live'"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic autogenerate output is machine-generated
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "numpy.*", "curl_cffi.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
