# The contract lock cannot be enforced without CI: openapi.json is
# committed and diffed against the generated one. This workflow is where
# that lock runs. ruff/mypy/pytest stay in the same job so the contract
# check is not a separate mechanism that can be skipped on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # requires-python = ">=3.13"; uv provides the interpreter.
      # The api extra is needed too: the OpenAPI check imports the app.
      # The scheduler extra brings APScheduler, without which the cron
      # validator falls back to counting fields and its strict path --
      # the one that catches `99 2 * * *` -- would never run here.
      # The kafka extra is for mypy: `outbox/kafka.py` imports
      # confluent_kafka, and without it installed the module is checked
      # against nothing.
      - name: Dependencies
        run: uv sync --extra dev --extra api --extra scheduler --extra kafka

      - name: ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      # `repo` and `live` markers are already deselected by addopts: they
      # need PostgreSQL and the real Yahoo API, neither of which runs here.
      - name: pytest
        run: uv run pytest -q

      # The contract lock. Prints the diff on failure, so the log answers
      # "what changed" without anyone having to reproduce it locally.
      - name: openapi.json is current
        run: uv run python scripts/dump_openapi.py --check

      # The same lock for the event stream. The envelope's `row` IS the
      # table row, so a column added anywhere changes what consumers
      # receive; this makes that a reviewable diff rather than a surprise.
      - name: docs/changes/schema.json is current
        run: uv run python scripts/dump_change_schema.py --check

  # The schema invariants (collation, FK policy, timestamp precision,
  # as-of key ordering) and the empty-diff rule are the project's stated
  # guarantees, and none of them ran here: `pytest -q` deselects the
  # `repo` marker because it needs a real database. A guarantee nothing
  # checks is a comment. This job brings the database.
  #
  # Separate from `check` on purpose: a database outage must not mask a
  # lint or type failure, and the fast job still gates in seconds.
  repo:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Same pin as docker-compose.yml. A moving tag would make a green
        # CI run say nothing about the engine anyone actually runs.
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_USER: yfin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yfinance
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yfin -d yfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: yfin
      DB_PASSWORD: ci
      DB_NAME: yfinance
      # The DB-backed settings layer would try to read a `settings` table
      # that migrations have not created yet.
      YF_SETTINGS_SOURCE: env
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependencies
        run: uv sync --extra dev --extra api --extra scheduler --extra kafka

      # No `yfin db create` step: this image ships the extension in
      # template1, so every database it creates already has timescaledb
      # and `create_hypertable` resolves. On an image that does not, the
      # migration fails with "function by_range(unknown, interval) does
      # not exist" and this step is where to add the CREATE EXTENSION.
      - name: Apply migrations
        run: uv run alembic upgrade head

      # The rule the project states but never enforced automatically:
      # the models and the migration history must agree.
      - name: alembic autogenerate is empty
        run: uv run alembic check

      # The `repo` fixtures create their own test database and schema, so
      # nothing beyond a reachable server is needed here.
      #
      # This is also where the published examples are locked. They are
      # captured from real responses, which needs a database, so the
      # content check cannot live in the fast job -- but that job still
      # fails when an example is MISSING, so neither half of the contract
      # can be skipped on its own.
      - name: pytest -m repo
        run: uv run pytest -q -m repo

  # The browser UI. Its own job on purpose: a Node failure must not mask
  # a Python one, and the Python jobs must not need Node -- the API runs
  # without the build and says so in the log.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
