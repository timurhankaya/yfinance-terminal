# The contract lock cannot be enforced without CI: openapi.json is
# committed and diffed against the generated one. This workflow is where
# that lock runs. ruff/mypy/pytest stay in the same job so the contract
# check is not a separate mechanism that can be skipped on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # requires-python = ">=3.13"; uv provides the interpreter.
      # The api extra is needed too: the OpenAPI check imports the app.
      - name: Dependencies
        run: uv sync --extra dev --extra api

      - name: ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      # `repo` and `live` markers are already deselected by addopts: they
      # need PostgreSQL and the real Yahoo API, neither of which runs here.
      - name: pytest
        run: uv run pytest -q

      # The contract lock. Prints the diff on failure, so the log answers
      # "what changed" without anyone having to reproduce it locally.
      - name: openapi.json is current
        run: uv run python scripts/dump_openapi.py --check
