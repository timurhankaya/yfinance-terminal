# The contract locks (openapi.json and friends) run in the same job as
# ruff/mypy/pytest so they cannot be skipped on their own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Every extra: the OpenAPI check imports the app, the strict cron
      # validator needs APScheduler, and mypy --strict needs confluent_kafka
      # and opentelemetry installed to check the modules that import them.
      - name: Dependencies
        run: >-
          uv sync --extra dev --extra api --extra scheduler --extra kafka
          --extra otel

      - name: ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      # `repo` and `live` markers are already deselected by addopts: they
      # need PostgreSQL and the real Yahoo API, neither of which runs here.
      - name: pytest
        run: uv run pytest -q

      # The contract lock. Prints the diff on failure, so the log answers
      # "what changed" without anyone having to reproduce it locally.
      - name: openapi.json is current
        run: uv run python scripts/dump_openapi.py --check

      # The same lock for the event stream. The envelope's `row` IS the
      # table row, so a column added anywhere changes what consumers
      # receive; this makes that a reviewable diff rather than a surprise.
      - name: docs/changes/schema.json is current
        run: uv run python scripts/dump_change_schema.py --check

      # And for the live tick body. The browser types a tick from the
      # generated table; a key renamed on the Python side only would
      # reach production as an undefined price on a chart that still drew.
      - name: web/src/live/tick-fields.json is current
        run: uv run python scripts/dump_tick_fields.py --check

      # Validated through the pinned images, so CI checks exactly what
      # compose runs.
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/rules/recording.yml

      # `fmt --test` rather than a lint: Alloy's parser is the only thing
      # that agrees with Alloy about its own syntax, and a river file that
      # is merely misformatted still fails to load in some versions.
      - name: alloy fmt --test
        run: |
          docker run --rm -v "$PWD/deploy/observability/alloy:/etc/alloy:ro" \
            --entrypoint alloy grafana/alloy:v1.19.2 \
            fmt --test /etc/alloy/config.alloy

      # The compose files reference each other's services, and the
      # override adds environment to services the base file defines -- a
      # name that drifted between them would be silently ignored.
      - name: compose files resolve
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml \
            config --quiet
        env:
          DB_PASSWORD: ci
          YFAPI_JWT_SIGNING_KEY: ci-signing-key-that-is-at-least-32-bytes

  # The `repo` marker needs a real database. Separate from `check` so a
  # database outage cannot mask a lint or type failure.
  repo:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Same pin as docker-compose.yml. A moving tag would make a green
        # CI run say nothing about the engine anyone actually runs.
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_USER: yfin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yfinance
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yfin -d yfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: yfin
      DB_PASSWORD: ci
      DB_NAME: yfinance
      # The DB-backed settings layer would try to read a `settings` table
      # that migrations have not created yet.
      YF_SETTINGS_SOURCE: env
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependencies
        run: uv sync --extra dev --extra api --extra scheduler --extra kafka

      # No `yfin db create` step: this image ships the extension in
      # template1, so every database it creates already has timescaledb
      # and `create_hypertable` resolves. On an image that does not, the
      # migration fails with "function by_range(unknown, interval) does
      # not exist" and this step is where to add the CREATE EXTENSION.
      - name: Apply migrations
        run: uv run alembic upgrade head

      # The rule the project states but never enforced automatically:
      # the models and the migration history must agree.
      - name: alembic autogenerate is empty
        run: uv run alembic check

      # Also locks the published API examples: they are captured from real
      # responses, so the content check needs the database.
      - name: pytest -m repo
        run: uv run pytest -q -m repo

  # The browser UI. Its own job on purpose: a Node failure must not mask
  # a Python one, and the Python jobs must not need Node -- the API runs
  # without the build and says so in the log.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
