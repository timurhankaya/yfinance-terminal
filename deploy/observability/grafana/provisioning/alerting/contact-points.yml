# One webhook contact point; email would need a relay to keep working.
# GRAFANA_ALERT_WEBHOOK arrives through `env_file` and Grafana expands the
# plain `$VAR` at load time, hence not compose's `${}`.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: yfin-default
    receivers:
      - uid: yfin-webhook
        type: webhook
        settings:
          url: $GRAFANA_ALERT_WEBHOOK
          httpMethod: POST

policies:
  - orgId: 1
    receiver: yfin-default
    group_by: ["grafana_folder", "alertname"]
    # Five minutes before the first notification: most of what fires here
    # is about a nightly job, and a thirty-second page for a run that is
    # about to finish is how an alert channel becomes one nobody reads.
    group_wait: 5m
    group_interval: 10m
    repeat_interval: 12h
