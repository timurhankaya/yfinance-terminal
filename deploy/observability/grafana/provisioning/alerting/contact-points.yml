# One contact point, and it is a webhook rather than SMTP.
#
# Email needs a relay that has to be configured, authenticated and kept
# working -- a second thing to monitor, and the first thing to fail
# silently. A webhook posts to whatever the operator already reads:
# Slack's incoming hooks, Discord's, an internal endpoint.
#
# GRAFANA_ALERT_WEBHOOK comes from deploy/observability/.env through
# `env_file`, and Grafana expands `$VAR` in this file at load time --
# which is why it is spelled with a plain `$` and not compose's `${}`.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: yfin-default
    receivers:
      - uid: yfin-webhook
        type: webhook
        settings:
          url: $GRAFANA_ALERT_WEBHOOK
          httpMethod: POST

policies:
  - orgId: 1
    receiver: yfin-default
    group_by: ["grafana_folder", "alertname"]
    # Five minutes before the first notification: most of what fires here
    # is about a nightly job, and a thirty-second page for a run that is
    # about to finish is how an alert channel becomes one nobody reads.
    group_wait: 5m
    group_interval: 10m
    repeat_interval: 12h
