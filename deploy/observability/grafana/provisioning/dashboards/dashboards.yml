# The repository is the source of the dashboards: `allowUiUpdates: false`,
# so a fix survives only if it is made in the JSON.

apiVersion: 1

providers:
  - name: yfin
    orgId: 1
    folder: yfin
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
