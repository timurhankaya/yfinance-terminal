# Single binary, filesystem storage; OTLP gRPC only. Alloy forwards traces
# here, so this listens on the internal network alone.
# Tempo 3.x config: the 2.x top-level `ingester:` and `compactor:` keys are a
# hard parse error here. `target` stays `all`; the "Worker address is empty
# in single binary mode" start-up warning is expected.

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

backend_worker:
  compaction:
    # 7 days, shorter than logs and metrics on purpose. Traces are the
    # bulkiest of the three and the least useful once cold: a week covers
    # "what was slow last night", which is what they are for here.
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
