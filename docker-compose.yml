# The database block every yfin service needs. One anchor rather than five
# copies: `db_host` is the service name here rather than localhost, and a
# password that drifted between two of them would be a container that
# starts, passes its health check and cannot read anything.
x-yfin-db: &yfin-db
  DB_HOST: timescaledb
  DB_PORT: 5432
  DB_USER: ${DB_USER:-yfin}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:-yfinance}

services:
  timescaledb:
    # Pinned on purpose: `latest-pg18` is a moving tag and returned
    # 2.29.2 where 2.26.3 was expected. A "works from scratch" check is
    # worthless if it silently runs against a different engine.
    image: timescale/timescaledb:2.29.2-pg18
    container_name: yfin-timescaledb
    # The same policy the scheduler and the stream carry, and it has to be:
    # those two return when the host does, and without this they return to
    # a database that never started. The four services holding the state
    # were the ones missing it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yfin}
      # `:?` refuses to start without a password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-yfinance}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # db.py caps connections at 2 x max(5, workers+4) per process. With
      # workers=4 and 4 shards that is (4 x 16) + 2 = 66; 200 leaves room.
      - -c
      - max_connections=200
      - -c
      - timescaledb.max_background_workers=8
    # Port comes from .env so a conflict is fixed in one place; config.py
    # reads the same DB_PORT key.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data. The
      # PostgreSQL 18 image puts data in a subdirectory of the mount so
      # `pg_upgrade --link` does not cross a mount boundary. The old path
      # leaves the container Exited(1) with "There appears to be
      # PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)".
      - yfin-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yfin} -d ${DB_NAME:-yfinance}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Pinned for the same reason as the database image: a moving tag makes
    # "works from scratch" meaningless. Upgrading is a deliberate edit.
    image: redis:7.4.2-alpine
    container_name: yfin-redis
    restart: unless-stopped
    command:
      - redis-server
      # Counters and the revocation epoch are the whole workload, and all
      # of it is reconstructible: quotas re-derive from api_usage_daily and
      # epoch keys expire within a token lifetime anyway. Persistence would
      # buy nothing and cost fsyncs on the request path.
      - --save
      - ""
      - --appendonly
      - "no"
      # A bounded cache, not a database. Without a cap, an attacker
      # spraying client ids at /oauth/token could grow the keyspace until
      # the process is OOM-killed -- and the rate limiter fails open, so
      # that outage would also remove the protection against the spray.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfin-api
    restart: unless-stopped
    environment:
      # The pipeline settings the API needs to reach the database; it reads
      # the same keys as the CLI.
      <<: *yfin-db
      # The signing key has no default on purpose: an API that starts
      # with a guessable key is worse than one that refuses to start.
      YFAPI_JWT_SIGNING_KEY: ${YFAPI_JWT_SIGNING_KEY:?YFAPI_JWT_SIGNING_KEY is required}
      YFAPI_JWT_KID: ${YFAPI_JWT_KID:-k1}
      YFAPI_JWT_ISSUER: ${YFAPI_JWT_ISSUER:-yfin-api}
      YFAPI_JWT_AUDIENCE: ${YFAPI_JWT_AUDIENCE:-yfin-api}
      YFAPI_REDIS_URL: redis://redis:6379/0
      # Empty by default, and that is the safe value: with no trusted
      # network the X-Forwarded-For header is ignored outright rather
      # than believed. Set it to the reverse proxy's CIDR in front of a
      # real deployment.
      YFAPI_TRUSTED_PROXIES: ${YFAPI_TRUSTED_PROXIES:-}
      YFAPI_CORS_ORIGINS: ${YFAPI_CORS_ORIGINS:-}
      YFAPI_DOCS_ENABLED: ${YFAPI_DOCS_ENABLED:-true}
      # The browser UI under /ui. Public: no login, no identity of any
      # kind. Switching it on exposes it to whoever can reach the port,
      # with only the per-address brake below in front of it.
      YFAPI_UI_ENABLED: ${YFAPI_UI_ENABLED:-false}
      YFAPI_UI_REQUESTS_PER_MINUTE: ${YFAPI_UI_REQUESTS_PER_MINUTE:-600}
      # The admin page at /admin; off while empty.
      YFAPI_ADMIN_PASSWORD: ${YFAPI_ADMIN_PASSWORD:-}
      # Published as the first `servers` entry and, in 1c, checked as the
      # WebSocket Origin. Leave empty on plain-HTTP localhost.
      YFAPI_PUBLIC_BASE_URL: ${YFAPI_PUBLIC_BASE_URL:-}
      TZ: UTC
    ports:
      # /docs (Swagger UI) and /redoc read the same document the API
      # serves at /openapi.json.
      - "${API_PORT:-8000}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka:
    # KRaft: no ZooKeeper. Pinned like every other image here.
    image: apache/kafka:3.9.0
    container_name: yfin-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners on purpose. A single one cannot serve both sides:
      # Kafka hands clients the ADVERTISED address to reconnect to, so a
      # broker advertising `kafka:9092` is unreachable from the host, and
      # one advertising `localhost:9092` is unreachable from other
      # containers. Either way it starts, passes a health check, and only
      # fails when something finally tries to produce.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node: the defaults of 3 would leave every internal topic
      # under-replicated and the broker unable to create them.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Two producers now: `yfin stream relay` for ticks and `yfin changes
      # relay` for pipeline row changes, both off by default and both
      # running as their own process. Neither is a throughput monster next
      # to a data pipeline that wants the memory, so the heap stays small
      # until a measurement says otherwise.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      TZ: UTC
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - yfin-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # --- the processes that keep the data fresh --------------------------------
  #
  # `scheduler` and `stream` are in the BASE file and carry no profile: they
  # are what makes the warehouse current, not part of the monitoring stack
  # that watches it. `docker compose up -d` brings them up with the
  # database, and `restart: unless-stopped` brings them back after a reboot
  # or a crash -- so the pipeline runs for as long as Docker does.
  #
  # The two relays DO carry a profile. Both refuse to start when their
  # feature is off (`yf_kafka_enabled`, `yf_changes_enabled`, both false by
  # default), and a service that exits 1 under `restart: unless-stopped` is
  # a crash loop rather than a disabled feature.

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfin-scheduler
    # The image's HEALTHCHECK is the API's: it asks 127.0.0.1:8000/health,
    # which this process does not serve. Inherited, it would report every
    # scheduler as permanently unhealthy -- worse than no check, because an
    # `unhealthy` that is always wrong is one nobody reads.
    #
    # The observability override replaces this with a real probe on the
    # service's own /metrics port, which is the port it actually listens on.
    healthcheck:
      disable: true
    command: ["yfin", "scheduler", "run"]
    environment:
      <<: *yfin-db
      # The API usage flush is one of its jobs, and that job reads Redis
      # through the API's own settings rather than the pipeline's.
      YFAPI_REDIS_URL: redis://redis:6379/0
      YFAPI_JWT_SIGNING_KEY: ${YFAPI_JWT_SIGNING_KEY:?YFAPI_JWT_SIGNING_KEY is required}
      TZ: UTC
    # PID 1 in a container does not reap orphans, and this process spawns
    # one subprocess per firing. Without an init, a shard whose parent
    # exited first would sit in the table as a zombie until the container
    # is replaced.
    init: true
    # Above the scheduler's own `yf_schedule_stop_grace_seconds` (600 by
    # default), so its bounded wait for a running job finishes BEFORE
    # Docker loses patience. Reversed, `docker stop` would SIGKILL a sync
    # holding the advisory lock, and the next run would find it held.
    stop_grace_period: ${SCHEDULER_STOP_GRACE:-620s}
    restart: unless-stopped
    volumes:
      # yfinance's SQLite tz/cookie cache. On a volume so a rebuilt
      # container does not re-fetch every timezone it already knew.
      - yfin-cache:/var/cache/yfin
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfin-stream
    # The image's HEALTHCHECK is the API's: it asks 127.0.0.1:8000/health,
    # which this process does not serve. Inherited, it would report every
    # scheduler as permanently unhealthy -- worse than no check, because an
    # `unhealthy` that is always wrong is one nobody reads.
    #
    # The observability override replaces this with a real probe on the
    # service's own /metrics port, which is the port it actually listens on.
    healthcheck:
      disable: true
    command: ["yfin", "stream", "run"]
    environment:
      <<: *yfin-db
      TZ: UTC
    init: true
    # The writer drains its queue on SIGTERM. Cut short, the ticks still in
    # it are lost -- and unlike a sync, there is no re-fetch: Yahoo's socket
    # does not replay.
    stop_grace_period: 60s
    restart: unless-stopped
    volumes:
      - yfin-cache:/var/cache/yfin
    depends_on:
      timescaledb:
        condition: service_healthy

  stream-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfin-stream-relay
    # The image's HEALTHCHECK is the API's: it asks 127.0.0.1:8000/health,
    # which this process does not serve. Inherited, it would report every
    # scheduler as permanently unhealthy -- worse than no check, because an
    # `unhealthy` that is always wrong is one nobody reads.
    #
    # The observability override replaces this with a real probe on the
    # service's own /metrics port, which is the port it actually listens on.
    healthcheck:
      disable: true
    command: ["yfin", "stream", "relay"]
    profiles: ["kafka"]
    environment:
      <<: *yfin-db
      TZ: UTC
    init: true
    restart: unless-stopped
    volumes:
      - yfin-cache:/var/cache/yfin
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  changes-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfin-changes-relay
    # The image's HEALTHCHECK is the API's: it asks 127.0.0.1:8000/health,
    # which this process does not serve. Inherited, it would report every
    # scheduler as permanently unhealthy -- worse than no check, because an
    # `unhealthy` that is always wrong is one nobody reads.
    #
    # The observability override replaces this with a real probe on the
    # service's own /metrics port, which is the port it actually listens on.
    healthcheck:
      disable: true
    command: ["yfin", "changes", "relay"]
    profiles: ["kafka"]
    environment:
      <<: *yfin-db
      TZ: UTC
    init: true
    restart: unless-stopped
    volumes:
      - yfin-cache:/var/cache/yfin
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  yfin-pgdata:
  yfin-kafka-data:
  yfin-cache:
